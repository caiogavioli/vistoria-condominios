name: Publicar app de vistorias

# Publica o app no GitHub Pages a cada push na main.
# A saída vai para o branch `gh-pages`, que é o que o Pages serve.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Endereço da API de sincronização, definido em
      # Settings -> Secrets and variables -> Actions -> Variables.
      # Sem ele o app continua funcionando exatamente como antes: tudo local,
      # sem sincronizar. É uma degradação silenciosa de propósito — melhor um
      # app offline funcionando do que uma tela de erro no meio da vistoria.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Login Microsoft: o portão só liga quando as duas existirem
          # (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}

      # .nojekyll impede o Jekyll de descartar arquivos do build.
      - run: touch dist/.nojekyll

      - name: Publicar no branch gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
